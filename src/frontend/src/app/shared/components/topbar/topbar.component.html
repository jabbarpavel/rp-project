<div class="topbar">
  <span 
    class="topbar__user"
    [ngClass]="{ incomplete: isIncomplete }"
    (click)="isIncomplete && goToProfile()"
  >
    {{ displayName }}
  </span>

  <span class="topbar__build" title="Branch · Commit · Build-Zeitpunkt">
    {{ buildLabel }}
  </span>

  <button class="topbar__btn" (click)="logout()">Logout</button>
</div>
